  },

    ['11:30 AM', 'Ceremony', 'Under the flower arch'],
    ['12:30 PM', 'Lunch reception', ''],

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ---------- renderer / camera ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true });
const isTouch = matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, isTouch ? 1.5 : 2));
renderer.setClearColor(0xffffff, 1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// soft cartoon sky gradient, repainted for day → sunset → night
const skyCanvas = document.createElement('canvas'); skyCanvas.width = 2; skyCanvas.height = 512;
const skyTex = new THREE.CanvasTexture(skyCanvas); skyTex.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTex;
const SKY_KEYS = [
  ['#4fa8ee', '#8ccdf7', '#dcf1ff'],   // day
  ['#6a5fb5', '#e98fae', '#ffc896'],   // sunset
  ['#0c1644', '#22306e', '#4b4f91'],   // night
];
function paintSky(k) {
  const seg = k < 0.5 ? 0 : 1, u = k < 0.5 ? k * 2 : (k - 0.5) * 2;
  const cols = SKY_KEYS[seg].map((c, i) => new THREE.Color(c).lerp(new THREE.Color(SKY_KEYS[seg + 1][i]), u));
  const g = skyCanvas.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 512);
  gr.addColorStop(0, '#' + cols[0].getHexString()); gr.addColorStop(0.55, '#' + cols[1].getHexString()); gr.addColorStop(1, '#' + cols[2].getHexString());
  g.fillStyle = gr; g.fillRect(0, 0, 2, 512); skyTex.needsUpdate = true;
  document.documentElement.style.background = document.body.style.background = '#' + cols[2].getHexString();
}
paintSky(0);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 1, 1000);
camera.position.set(105, 62, 130);

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  // portrait phones: widen the vertical FOV so the island still fits side to side
  const half = THREE.MathUtils.degToRad(16);
  camera.fov = camera.aspect < 1 ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(half) / camera.aspect * 0.9)) : 32;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 22;
controls.maxDistance = 340;
controls.maxPolarAngle = Math.PI * 0.85;
controls.addEventListener('start', () => (document.getElementById('hint').style.opacity = 0));

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xffffff, 0xd8e2d0, 1.4); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff2dc, 2.6);
sun.position.set(40, 70, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 2048 : 4096, isTouch ? 2048 : 4096);
Object.assign(sun.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 200 });
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.05;
scene.add(sun);

/* ---------- cartoon materials ---------- */
const gradientMap = new THREE.DataTexture(new Uint8Array([105, 185, 255]), 3, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.needsUpdate = true;
const toon = (opts = {}) => new THREE.MeshToonMaterial({ gradientMap, ...opts });

// inverted-hull outline: same mesh, back faces only, pushed out along normals
function outlineMaterial(width) {
  const m = new THREE.MeshBasicMaterial({ color: 0x24302a, side: THREE.BackSide });
  // width is a uniform: three.js caches programs by onBeforeCompile source, so it must not be baked into the shader
  m.onBeforeCompile = sh => {
    sh.uniforms.outlineW = { value: width };
    sh.vertexShader = 'uniform float outlineW;\n' + sh.vertexShader.replace(
      '#include <begin_vertex>',
      'vec3 transformed = position + normalize(normal) * outlineW;'
    );
  };
  return m;
}
function withOutline(mesh, width) {
  let hull;
  if (mesh.isInstancedMesh) {
    hull = new THREE.InstancedMesh(mesh.geometry, outlineMaterial(width), mesh.count);
    hull.instanceMatrix = mesh.instanceMatrix;
  } else if (mesh.isSkinnedMesh) {
    hull = new THREE.SkinnedMesh(mesh.geometry, outlineMaterial(width));
    hull.bind(mesh.skeleton, mesh.bindMatrix);
  } else hull = new THREE.Mesh(mesh.geometry, outlineMaterial(width));
  mesh.add(hull);
  return mesh;
}

/* ---------- noise ---------- */
const SEED = 1337;
function hash(x, y, z = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(z | 0, 2147483647) ^ Math.imul(SEED, 982451653);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
const fbm = (x, y) => (noise(x, y) * 4 + noise(x * 2.03, y * 2.03) * 2 + noise(x * 4.1, y * 4.1)) / 7;
let rs = 7; const rand = () => ((rs = Math.imul(rs ^ (rs >>> 15), 2654435761) + 0x6d2b79f5) >>> 0) / 4294967295;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

/* ---------- island shape ---------- */
const R = 34;
// mountains sit at the back so the four corners stay free for story scenes
const peaks = [
  { x: -6, z: -17, h: 30, r: 15 },
  { x: 9, z: -21, h: 24, r: 12 },
  { x: -21, z: -9, h: 13, r: 10 },
];
const lake = { x: -13, z: 9, rx: 7.5, rz: 5.5 };   // front-left corner + waterfall
const garden = { x: 14, z: 12, r: 13 };               // front-right corner: wedding garden
const gallery = { x: 22, z: -8, r: 10 };              // right corner: outdoor photo gallery
const fountain = { x: -5, z: -6, r: 9 };               // terrace at the foot of the mountains
const zones = [garden, gallery, fountain];
const ROADS = [
  [[-3.8, 1.9], [-3.1, 8], [-2.3, 15], [-1.7, 21], [-1.4, 25.5]],   // grand avenue: fountain → front-edge overlook
  [[0.5, -0.2], [2.1, 1.6], [3.7, 3.2]],                             // fountain → ceremony entrance
];
const roadCurves = ROADS.map(r => new THREE.CatmullRomCurve3(r.map(([x, z]) => new THREE.Vector3(x, 0, z))));
const roadSamples = roadCurves.flatMap(c => c.getSpacedPoints(Math.ceil(c.getLength() / 0.5)));
const roadDist = (x, z) => { let m = Infinity; for (const p of roadSamples) m = Math.min(m, (p.x - x) ** 2 + (p.z - z) ** 2); return Math.sqrt(m); };
const inZone = (x, z, pad = 0) => zones.some(q => Math.hypot(x - q.x, z - q.z) < q.r + pad) || roadDist(x, z) < 2.6 + pad;
const WATER_Y = -0.25;

const rEdge = a => R * (0.8 + 0.38 * fbm(Math.cos(a) * 1.3 + 7.3, Math.sin(a) * 1.3 + 3.1));
function mountainH(x, z) {
  let m = 0;
  for (const p of peaks) m = Math.max(m, p.h * Math.pow(Math.max(0, 1 - Math.hypot(x - p.x, z - p.z) / p.r), 1.25));
  if (m > 0.5) m += (fbm(x * 0.3, z * 0.3) - 0.5) * 3 * Math.min(1, m / 4);
  return m;
}
const lakeD = (x, z) => ((x - lake.x) / lake.rx) ** 2 + ((z - lake.z) / lake.rz) ** 2;
function topH(x, z) {
  let h = 0.9 * fbm(x * 0.15 + 20, z * 0.15) + mountainH(x, z);
  for (const q of zones) {                                                            // flat lawns for story corners
    const g = smooth(q.r + 3, q.r - 1, Math.hypot(x - q.x, z - q.z));
    h = h * (1 - g) + 0.5 * g;
  }
  h -= 2.0 * smooth(1.0, 0.45, lakeD(x, z));                                         // lake bowl

// one closed mesh: rows go centre → rim (top) then rim → tip (underside)
const NS = 240, NT = 110, NB = 50;
const pos = [], col = [], rows = [];
const C = h => new THREE.Color(h);
const GRASS_A = C('#8fd65b'), GRASS_B = C('#69be44'), FOREST = C('#4ea546'), ROCK = C('#b0a796'), SNOW = C('#fbfbf7'), SAND = C('#d9c48f');
const MOSS = C('#57a83f'), DIRT = C('#9a7550'), RK_T = C('#a08a72'), RK_B = C('#5b4a3f');
const tc = new THREE.Color();

for (let i = 0; i <= NT; i++) {           // top surface
  const t = i / NT;
  const row = [];
  for (let j = 0; j < NS; j++) {
    const a = (j / NS) * Math.PI * 2;
    const r = rEdge(a) * Math.sqrt(t);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    let y = topH(x, z);
    y -= 0.6 * smooth(0.92, 1, Math.sqrt(t)); // round the rim over
    row.push(pos.length / 3); pos.push(x, y, z); col.push(0, 0, 0);
  }
  rows.push(row);
}
const topRows = rows.length;
for (let k = 1; k <= NB; k++) {           // underside
  const u = k / NB;
  const row = [];
  for (let j = 0; j < NS; j++) {
    const a = (j / NS) * Math.PI * 2;
    const ca = Math.cos(a), sa = Math.sin(a);
    const jag = 1 + 0.16 * (noise(ca * 3 + sa * 5 + 50, u * 6) - 0.5) + 0.12 * (noise(j * 0.35, u * 10) - 0.5) * u;
    const r = rEdge(a) * Math.pow(1 - u, 0.85) * jag;
    const x = ca * r, z = sa * r;
    const rimY = topH(ca * rEdge(a), sa * rEdge(a)) - 0.6;
    const depth = (1.5 + 44 * Math.pow(u, 1.15)) * (0.85 + 0.3 * fbm(ca * 2 + 9, sa * 2 + 9));
    const y = rimY - depth;
    row.push(pos.length / 3); pos.push(x, y, z);
    // colour: hanging moss near the rim, then dirt, then layered rock
    const mossLine = 0.05 + 0.13 * noise(j * 0.45, 3.3) + 0.06 * noise(j * 1.7, 9.1);
    if (u < mossLine) tc.copy(MOSS).multiplyScalar(0.9 + 0.2 * noise(j * 0.8, u * 20));
    else if (u < mossLine + 0.04) tc.copy(DIRT);
    else {
      tc.copy(RK_T).lerp(RK_B, Math.min(1, u * 1.1));
      tc.multiplyScalar(0.92 + 0.12 * Math.sin(y * 1.1 + noise(j * 0.2, 1) * 3)); // strata bands
    }
    col.push(tc.r, tc.g, tc.b);
  }
  rows.push(row);
}
const idx = [];
for (let i = 0; i < rows.length - 1; i++)
  for (let j = 0; j < NS; j++) {
    const a = rows[i][j], b = rows[i][(j + 1) % NS], c = rows[i + 1][j], d = rows[i + 1][(j + 1) % NS];
    idx.push(a, c, b, b, c, d);
  }
const islandGeo = new THREE.BufferGeometry();
islandGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
islandGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
islandGeo.setIndex(idx);

  for (let i = 0; i < idx.length; i += 3) [idx[i + 1], idx[i + 2]] = [idx[i + 2], idx[i + 1]];
  islandGeo.setIndex(idx);
  islandGeo.computeVertexNormals();
}
// clean analytic normals on the top surface (avoids the polar-centre seam)
{
  const P = islandGeo.attributes.position, N = islandGeo.attributes.normal, e = 0.15, n = new THREE.Vector3();
  for (let i = 0; i < topRows - 6; i++) for (const v of rows[i]) {
    const x = P.getX(v), z = P.getZ(v);
    n.set(topH(x - e, z) - topH(x + e, z), 2 * e, topH(x, z - e) - topH(x, z + e)).normalize();
    N.setXYZ(v, n.x, n.y, n.z);
  }
}
// colour the top surface using height + slope
{
  const P = islandGeo.attributes.position, N = islandGeo.attributes.normal, Co = islandGeo.attributes.color;
  for (let i = 0; i < topRows; i++) for (const v of rows[i]) {
    const x = P.getX(v), y = P.getY(v), z = P.getZ(v), ny = N.getY(v);
    const m = inZone(x, z, 2) ? 0 : mountainH(x, z);
    if (m > 1.5) {

    } else {

    }
    Co.setXYZ(v, tc.r, tc.g, tc.b);
  }
}

const CLOUD_TOP = C('#ffffff'), CLOUD_MID = C('#eef5fc'), CLOUD_BOT = C('#c9def2');
function makeCloud(size) {
  const parts = [];
  const puff = (x, y, z, r) => { const g = new THREE.IcosahedronGeometry(r, 3); g.translate(x, y, z); parts.push(g); };
  const n = 4 + Math.floor(rand() * 3);
  for (let i = 0; i < n; i++) {                                  // base row
    const u = i / (n - 1) - 0.5;
    puff(u * size * 3, 0, (rand() - 0.5) * size * 0.6, size * (0.65 + (0.5 - Math.abs(u)) * 0.5 + rand() * 0.1));
  }
  const m = 1 + Math.floor(rand() * 2);
  for (let i = 0; i < m; i++)                                   // tall puffs on top
    puff((i - (m - 1) / 2) * size * 1.1 + (rand() - 0.5) * size * 0.4, size * 0.55, (rand() - 0.5) * size * 0.3, size * (0.8 + rand() * 0.25));
  const geo = mergeGeometries(parts);
  const P = geo.attributes.position, N = geo.attributes.normal, col = [];
  for (let i = 0; i < P.count; i++) {
    const y = P.getY(i), ny = N.getY(i);
    const c = y < size * 0.08 ? CLOUD_BOT : ny < 0.35 ? CLOUD_MID : CLOUD_TOP;
    col.push(c.r, c.g, c.b);
    if (y < 0) P.setY(i, y * 0.28);                              // flatten the underside
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true }));
}

const toW3 = (g, x, y, z) => { g.updateMatrix(); return new THREE.Vector3(x, y, z).applyMatrix4(g.matrix); };
function freeSpot(x0, z0, r) {                          // nearest clear patch of grass around (x0, z0)
  for (let ring = 0; ring < 40; ring++) for (let k = 0; k < Math.max(1, ring * 6); k++) {
    const a = (k / Math.max(1, ring * 6)) * Math.PI * 2, x = x0 + Math.cos(a) * ring * 0.5, z = z0 + Math.sin(a) * ring * 0.5;
    if (Math.hypot(x, z) > rEdge(Math.atan2(z, x)) * 0.82 || lakeD(x, z) < 1.6 || (Math.abs(x - lake.x) < 2.5 && z > lake.z)) continue;
    if (mountainH(x, z) > 1.5 || inZone(x, z, r * 0.6)) continue;
    if (colliders.some(c => Math.hypot(x - c.x, z - c.z) < c.r + r)) continue;
    return [x, z];
  }
  return [x0, z0];
}
function clearTreesAround(x, z, r) {                    // hide any tree trunk/canopy instances that poke into a new prop
  for (const mesh of world.children) {
    if (!mesh.isInstancedMesh || !mesh.userData.tree) continue;
    const m = new THREE.Matrix4(), p = new THREE.Vector3();
    for (let i = 0; i < mesh.count; i++) {

    }
  }
}

    for (let i = 0; i < px.length; i += 4) {
      const l = (px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11) / (maxL || 1);
      const f = 0.55 + 0.45 * l;                                         // keep the soft shading ramp
      px[i] = Math.min(255, tgt.r * 255 * f); px[i + 1] = Math.min(255, tgt.g * 255 * f); px[i + 2] = Math.min(255, tgt.b * 255 * f);
    }
    g.putImageData(d, x0, yy);
  }
  const tex = new THREE.CanvasTexture(c); tex.flipY = m.baseMap.flipY; tex.colorSpace = m.baseMap.colorSpace;
  tex.magFilter = m.baseMap.magFilter; tex.minFilter = m.baseMap.minFilter;
  m.mats.forEach(mt => { mt.map = tex; mt.needsUpdate = true; });
  if (who === 'bride' && m.skirt) m.skirt.material.color.set(look.outfit || '#ffffff');
}
function registerCouple(who, obj, extra = {}) {
  const mats = []; let baseMap = null;
  obj.traverse(o => { if (o.isSkinnedMesh && o.material.map) { o.material = o.material.clone(); mats.push(o.material); baseMap = o.material.map; } });
  coupleModels[who] = { mats, baseMap, flipY: baseMap.flipY, blocks: analyseLook(obj), ...extra };
  applyLook(who);
}
const LOOK_SWATCH = {
  skin: ['#ffe0c4', '#f3c29b', '#e0a57a', '#c58157', '#9a5f3c', '#6e432a'],
  hair: ['#2b2420', '#4a3226', '#7a4a2a', '#b07a45', '#e2c27a', '#9a9aa2'],
  outfit: { bride: ['#ffffff', '#fff3e0', '#ffd6e0', '#e8dcff', '#d6f0ff', '#f6e7c8'], groom: ['#2e2e36', '#24345e', '#6b6f7a', '#d9c7a6', '#ffffff', '#5a3a2e'] },
};
function openLookEditor() {
  const row = (who, part, list) => `<div class="look-row"><span>${part}</span>${list.map(h =>
    `<button data-who="${who}" data-part="${part}" data-hex="${h}" style="background:${h}" class="${CONFIG.look[who][part] === h ? 'on' : ''}"></button>`).join('')}
    <button data-who="${who}" data-part="${part}" data-hex="" title="original" style="background:repeating-linear-gradient(45deg,#eee 0 4px,#fff 4px 8px)" class="${!CONFIG.look[who][part] ? 'on' : ''}"></button></div>`;
  const html = who => `<p style="margin:14px 0 2px"><b>${who === 'bride' ? 'Bride' : 'Groom'}</b></p>` +
    row(who, 'skin', LOOK_SWATCH.skin) + row(who, 'hair', LOOK_SWATCH.hair) + row(who, 'outfit', LOOK_SWATCH.outfit[who]);
  openPanel(`<h2>Couple look</h2><p class="sub">Only you see this editor (?design). Pick colours, then copy the line below into CONFIG.look.</p>
    ${html('bride')}${html('groom')}<pre id="lookOut"></pre>`);
  const out = () => (document.getElementById('lookOut').textContent = 'look: ' + JSON.stringify(CONFIG.look));
  out();
  panelBody.querySelectorAll('.look-row button').forEach(b => b.addEventListener('click', () => {
    CONFIG.look[b.dataset.who][b.dataset.part] = b.dataset.hex || null;
    b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    applyLook(b.dataset.who); out();
    try { localStorage.setItem('look', JSON.stringify(CONFIG.look)); } catch {}
  }));
}
if (new URLSearchParams(location.search).has('shot')) document.body.classList.add('shot');
const designMode = new URLSearchParams(location.search).has('design');
if (designMode) { try { const saved = JSON.parse(localStorage.getItem('look') || 'null'); if (saved) CONFIG.look = saved; } catch {} }

/* ---------- top-right tools ---------- */
document.querySelectorAll('#tools button').forEach(b => b.addEventListener('click', () => {
  const t = b.dataset.tool;
  if (t === 'venue') openVenue(); else if (t === 'schedule') openSchedule(); else if (t === 'wish') openWish();
  else if (t === 'night') setNight(nightTarget === 0);
}));
if (designMode) {
  const b = document.createElement('button'); b.innerHTML = '<span>🎨</span><b>Look</b>'; b.addEventListener('click', openLookEditor);
  document.getElementById('tools').appendChild(b);
}
if (/[#&]night\b/.test(location.hash) || new URLSearchParams(location.search).has('night')) { setNight(true); nightK = 1; }

/* ---------- walk mode: control a guest with keys or the joystick ---------- */
let player = null, playerAnim = 'idle';
const playerActs = {};
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); });
addEventListener('keyup', e => { keys.delete(e.key.toLowerCase()); });
const joy = document.getElementById('joy'), knob = document.getElementById('knob'), joyVec = new THREE.Vector2();
let joyId = null;
function joyMove(e) {
  const r = joy.getBoundingClientRect(), max = r.width * 0.37;
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy); if (d > max) { dx *= max / d; dy *= max / d; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  joyVec.set(dx / max, dy / max);
}
joy.addEventListener('pointerdown', e => { joyId = e.pointerId; joy.setPointerCapture(e.pointerId); joyMove(e); e.preventDefault(); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; joyVec.set(0, 0); knob.style.transform = ''; };
joy.addEventListener('pointerup', joyEnd); joy.addEventListener('pointercancel', joyEnd);

function groundAt(x, z) {
  if (Math.hypot(x - garden.x, z - garden.z) < 7.2 * 1.6) return 0.5 + 0.23 * 1.6;
  if (Math.hypot(x - fountain.x, z - fountain.z) < 4.9 * 1.6) return 0.5 + 0.19 * 1.6;
  return topH(x, z) + (roadDist(x, z) < 1.4 ? 0.1 : 0);
}
function walkBlocked(x, z) {
  if (Math.hypot(x, z) > rEdge(Math.atan2(z, x)) * 0.88) return true;          // island edge
  if (lakeD(x, z) < 1.1) return true;                                           // lake
  if (Math.abs(x - lake.x) < 2 && z > lake.z) return true;                      // river
  if (!inZone(x, z) && mountainH(x, z) > 3) return true;                        // steep mountain
  return false;
}
const PLAYER_R = 0.5;
let seated = null;
function movePlayer(dx, dz) {
  const p = player.position;
  let nx = p.x + dx, nz = p.z + dz;
  if (walkBlocked(nx, nz)) {                                  // slide along walls
    if (!walkBlocked(p.x + dx, p.z)) nz = p.z; else if (!walkBlocked(p.x, p.z + dz)) nx = p.x; else return;
  }
  for (let pass = 0; pass < 2; pass++) for (const c of colliders) {
    const ox = nx - c.x, oz = nz - c.z, d = Math.hypot(ox, oz), min = c.r + PLAYER_R;
    if (d < min && d > 1e-4) { nx = c.x + (ox / d) * min; nz = c.z + (oz / d) * min; }
  }
  if (walkBlocked(nx, nz)) return;
  p.set(nx, groundAt(nx, nz), nz);
}
function setPlayerAnim(name) {
  if (name === playerAnim || !playerActs[name]) return;
  playerActs[playerAnim]?.fadeOut(0.2);
  playerActs[name].reset().fadeIn(0.2).play();
  playerAnim = name;
}
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), pw = new THREE.Vector3(), lastPW = new THREE.Vector3();
function updatePlayer(dt) {
  if (!player) return;
  let ix = joyVec.x, iy = -joyVec.y;
  if (keys.has('w') || keys.has('arrowup')) iy += 1;
  if (keys.has('s') || keys.has('arrowdown')) iy -= 1;
  if (keys.has('d') || keys.has('arrowright')) ix += 1;
  if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
  const mag = Math.min(1, Math.hypot(ix, iy));
  if (seated) {                                              // sitting on a bench until you move
    setPlayerAnim('sit');
    if (currentView === 'walk' && mag > 0.12) { player.position.copy(seated.stand); seated = null; }
  } else {
  const active = currentView === 'walk' && !fly && !lb.classList.contains('open') && mag > 0.12;
  if (active) {
    camera.getWorldDirection(fwd); fwd.y = 0; fwd.normalize();
    right.crossVectors(fwd, camera.up).normalize();
    const dir = fwd.multiplyScalar(iy).add(right.multiplyScalar(ix)).normalize();
    const run = keys.has('shift') || Math.hypot(joyVec.x, joyVec.y) > 0.9;
    const speed = (run ? 8.5 : 4.2) * mag;
    movePlayer(dir.x * speed * dt, dir.z * speed * dt);
    const want = Math.atan2(dir.x, dir.z);
    let diff = want - player.rotation.y; diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.rotation.y += diff * Math.min(1, dt * 10);
    setPlayerAnim(run ? 'sprint' : 'walk');
  } else setPlayerAnim('idle');
  }
  if (currentView === 'walk' && !fly) walkExtras(dt);
  // camera follows the walker
  if (currentView === 'walk' && !fly) {
    player.getWorldPosition(pw); pw.y += 1.8;
    const delta = pw.clone().sub(controls.target);
    controls.target.add(delta); camera.position.add(delta);
  }
}
charsReady.then(() => {
  player = spawn('male-a', world, { x: -1.4, z: 23.5, rotY: Math.PI });
  player.scale.multiplyScalar(1.6);
  player.position.y = groundAt(-1.4, 23.5);
  const mixer = player.userData.mixer, clips = charLib['male-a'].animations;
  for (const n of ['idle', 'walk', 'sprint', 'sit']) playerActs[n] = mixer.clipAction(THREE.AnimationClip.findByName(clips, n));
  playerActs.idle.play();
  // little floating marker so you can spot "you"
  const mk = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.18, 4), new THREE.MeshBasicMaterial({ color: 0xff7aa2 }));
  mk.rotation.x = Math.PI; mk.position.y = 0.95; mk.name = 'you-marker'; player.add(mk);
  if (startHash === 'walk') goTo('walk', true);
});

/* ---------- guided views: fly the camera between story spots ---------- */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const VIEWS = {
  island:   { pos: V(105, 62, 130), target: V(0, 0, 0), title: `${esc(CONFIG.bride)} &amp; ${esc(CONFIG.groom)}`,
              text: `are getting married!<br><small>${esc(CONFIG.dateText)}</small>` },
  ceremony: { pos: V(garden.x + 20, 14, garden.z + 26), target: V(garden.x, 4.5, garden.z),
              title: 'The Ceremony', text: 'Join us under the flower arch as we say “I do”.<br><small>Date &amp; time · to be announced</small>' },
  gallery:  { pos: V(gallery.x + 30, 16, gallery.z + 4), target: V(gallery.x, 4.5, gallery.z),
              title: 'Our Moments', text: 'A little walk through our story.<br><small>Tap any photo to see it up close</small>' },
  walk:     { title: 'Take a stroll', text: isTouch ? 'Walk around the island as a guest.<br><small>Use the joystick · push all the way to run</small>'
                                                    : 'Walk around the island as a guest.<br><small>WASD / arrow keys · hold Shift to run</small>' },
};
function walkView() {
  if (!player) return null;
  player.getWorldPosition(pw);
  const f = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
  return { ...VIEWS.walk, pos: pw.clone().addScaledVector(f, -13).add(V(0, 8, 0)), target: pw.clone().add(V(0, 1.8, 0)) };
}
let currentView = 'island', fly = null;
const card = document.getElementById('card'), hint = document.getElementById('hint');
const easeInOut = k => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
function goTo(name, instant = false) {
  const v = name === 'walk' ? walkView() : { ...VIEWS[name] };
  if (!v) return;
  document.body.classList.toggle('walking', name === 'walk');
  if (name !== 'walk') { actBtn.classList.remove('show'); nearAct = null; }
  controls.minDistance = name === 'walk' ? 6 : 22;
  controls.maxDistance = name === 'walk' ? 45 : 340;
  currentView = name;
  history.replaceState(null, '', name === 'island' ? location.pathname : '#' + name);
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  card.classList.toggle('show', !!v.title);
  if (v.title) card.innerHTML = `<h2>${v.title}</h2><p>${v.text}</p>`;
  hint.textContent = name === 'island' ? 'drag to rotate · tap a corner to visit'
    : name === 'gallery' ? (isTouch ? 'tap a photo to open it' : 'click a photo · esc to go back')
    : name === 'walk' ? (isTouch ? 'joystick to walk · drag to look' : 'wasd to walk · drag to look')
    : 'drag to look around · esc to go back';
  hint.style.opacity = 1;
  controls.autoRotate = name === 'island';
  tip.classList.remove('show');
  if (name !== 'island' && name !== 'walk' && camera.aspect < 1) {   // portrait phone: come in closer
    v.pos = v.target.clone().add(VIEWS[name].pos.clone().sub(v.target).multiplyScalar(name === 'gallery' ? 0.95 : 0.8));
  } else if (VIEWS[name].pos) v.pos = VIEWS[name].pos;
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.target); controls.update(); return; }
  fly = { t: 0, dur: 2.2, p0: camera.position.clone(), p1: v.pos.clone(), t0: controls.target.clone(), t1: v.target.clone(),
          lift: Math.min(18, camera.position.distanceTo(v.pos) * 0.12) };
  controls.enabled = false;
}
function updateFly(dt) {
  if (!fly) return false;
  fly.t += dt;
  const k = Math.min(1, fly.t / fly.dur), e = easeInOut(k);
  camera.position.lerpVectors(fly.p0, fly.p1, e);
  camera.position.y += Math.sin(Math.PI * e) * fly.lift;          // gentle swoop
  controls.target.lerpVectors(fly.t0, fly.t1, e);
  camera.lookAt(controls.target);
  if (k >= 1) { fly = null; controls.enabled = true; controls.update(); }
  return true;
}
document.querySelectorAll('#nav button').forEach(b => b.addEventListener('click', () => goTo(b.dataset.view)));

// deep links: #ceremony / #gallery (old #garden still works); #cam=x,y,z,tx,ty,tz for close-up checks
const startHash = location.hash.slice(1).replace('garden', 'ceremony');
const camHash = location.hash.match(/^#cam=([-\d.,]+)$/);
if (camHash) { const v = camHash[1].split(',').map(Number); camera.position.set(v[0], v[1], v[2]); controls.target.set(v[3], v[4], v[5]); controls.autoRotate = false; }
else goTo(VIEWS[startHash] ? startHash : 'island', true);

/* ---------- animate ---------- */
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta(), t = clock.elapsedTime;
  world.position.y = 4 + Math.sin(t * 0.8) * 0.8;
  world.rotation.z = Math.sin(t * 0.5) * 0.012;
  fallTex.offset.y += dt * 0.9;
  fountainTick(t);
  for (const g of glints) g.material.opacity = Math.max(0, Math.sin(t * 1.3 + g.userData.phase));
  for (const h of hearts) {
    h.position.copy(h.userData.base).y += Math.sin(t * 1.4 + h.userData.phase) * 0.25;
    h.rotation.y = Math.sin(t * 0.9 + h.userData.phase) * 0.6;
  }
  for (const c of clouds) {
    const u = c.userData, a = u.a + t * u.speed;
    c.position.set(Math.cos(a) * u.r, u.y + Math.sin(t * 0.4 + u.phase) * 1.2, Math.sin(a) * u.r);
  }
  for (const m of mixers) m.update(dt);
  updatePlayer(dt);
  tickNight(dt, t); tickLanterns(dt, t); tickDucks(dt, t); tickPetals(dt, t);
  const showBadges = currentView === 'gallery' || currentView === 'walk';
  photoBadges.forEach((b, i) => {
    b.visible = showBadges;
    b.material.opacity = 0.75 + 0.25 * Math.sin(t * 3 + i);
    b.position.y = b.userData.y0 ??= b.position.y; b.position.y = b.userData.y0 + Math.sin(t * 2.4 + i) * 0.07;
  });
  // speech-bubble nudge pointing at a photo until the visitor opens one
  const nudge = document.getElementById('nudge');
  if (currentView === 'gallery' && !fly && !seenPhoto && !lb.classList.contains('open')) {
    photoMeshes[2].getWorldPosition(pw); pw.y += 2.2; pw.project(camera);
    nudge.style.transform = `translate(calc(${Math.min(innerWidth - 100, Math.max(100, (pw.x * 0.5 + 0.5) * innerWidth))}px - 50%), calc(${(-pw.y * 0.5 + 0.5) * innerHeight}px - 100%))`;
    nudge.classList.add('show');
  } else nudge.classList.remove('show');
  if (!updateFly(dt)) controls.update();
  renderer.render(scene, camera);
});
